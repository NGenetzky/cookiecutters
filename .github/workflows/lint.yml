name: Lint

on:
  pull_request:
    paths:
      - 'template/**/*.py'
      - 'template/requirements-dev.txt'
      - '.github/workflows/lint.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'template/**/*.py'
      - 'template/requirements-dev.txt'
      - '.github/workflows/lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flake8:
    name: Flake8 template tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.8 for legacy flake8 compatibility
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r template/requirements-dev.txt

      - name: Run flake8 on Python sources
        run: |
          flake8 template/tests
